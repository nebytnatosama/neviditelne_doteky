<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Player</title>

  <script type="module" src="https://cdn.jsdelivr.net/npm/@videojs/html@10.0.0-beta.31/cdn/video-minimal.js"></script>

  <style>
    body {
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .video-wrapper {
      width: min(100%, calc(90vh * 9 / 16));
      aspect-ratio: 9 / 16;
    }

    .video-wrapper video-player {
      width: 100%;
      height: 100%;
      display: block;
    }

    @media (pointer: coarse) {
      .video-wrapper video-player {
        --media-scale: 1.15;
      }
    }
  </style>
</head>
<body>

  <div class="video-wrapper">
    <video-player>
      <video-minimal-skin>
        <video src="nd1.mp4" playsinline></video>
      </video-minimal-skin>
    </video-player>
  </div>

</body>
</html>
